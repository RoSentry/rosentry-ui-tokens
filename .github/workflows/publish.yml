name: Publish to npm
on:
  push: { branches: [staging, main] }
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - name: Validate package (staging)
        if: github.ref != 'refs/heads/main'
        run: npm pack --dry-run
      - name: Publish if version is new (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already published — skipping."; else npm publish --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
